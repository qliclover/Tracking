<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="有余 Margin — 你的每月余地，从容记账。" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- 霞鹜文楷 (LXGW WenKai) — warm handwritten kai for Chinese text.
         Loaded progressively; falls back to PingFang SC if unavailable. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont/style.css"
      rel="stylesheet"
    />
    <title>有余 · Room to spend</title>
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('margin.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
